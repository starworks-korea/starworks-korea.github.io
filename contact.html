a{color:inherit;text-decoration:none}a:hover{color:#0070C0}
.cf{background-color:#1E3252}

<body>
<div style="width: 100%; font-family: 'Noto Sans KR', sans-serif; color: #1E3252; background: #F4F6F9">

<header style="background: #1E3252; border-bottom: 1px solid rgba(255,255,255,0.15)">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF">
<img src="images/logo.svg" alt="STAR Works" style="height: 40px; width: auto; display: block">
</a>
<nav aria-label="주 메뉴" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<a href="index.html" style="padding: 12px 14px; font-size: 15px; color: #C9D3E0">회사소개</a>
<a href="projects.html" style="padding: 12px 14px; font-size: 15px; color: #C9D3E0">프로젝트</a>

<a href="contact.html" style="margin-left: 8px; padding: 12px 18px; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #0070C0; border-radius: 4px">제작 문의</a>
</nav>
</div>
</header>

<section class="grid-bg" style="color: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 64px; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; letter-spacing: 2px; color: #9CC3E8">CONTACT</p>
<h1 style="margin: 0; font-size: 48px; font-weight: 900; letter-spacing: -1px">제작 문의</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.7; color: #C9D3E0; max-width: 640px">도면·사진·시험 데이터와 함께 보내 주세요.</p>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 96px; display: flex; flex-wrap: wrap; gap: 40px">

<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 8px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Noto Sans KR', sans-serif; font-size: 13px; letter-spacing: 1px; color: #5A6478">ADDRESS</span>
<span style="font-size: 17px; font-weight: 700">경북 경산시 남매공원로2길 10, 1층</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Noto Sans KR', sans-serif; font-size: 13px; letter-spacing: 1px; color: #5A6478">TEL</span>
<a href="tel:010-4401-7115" style="font-size: 17px; font-weight: 700">010-4401-7115</a>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Noto Sans KR', sans-serif; font-size: 13px; letter-spacing: 1px; color: #5A6478">E-MAIL</span>
<a href="mailto:shindongwoo@gmail.com" style="font-size: 17px; font-weight: 700">shindongwoo@gmail.com</a>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<iframe title="스타웍스 위치 지도" src="https://maps.google.com/maps?q=%EA%B2%BD%EB%B6%81%20%EA%B2%BD%EC%82%B0%EC%8B%9C%20%EB%82%A8%EB%A7%A4%EA%B3%B5%EC%9B%90%EB%A1%9C2%EA%B8%B8%2010&amp;z=16&amp;output=embed" style="width: 100%; height: 320px; border: 0; border-radius: 8px; display: block; background: #DCE1E8" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
<a href="https://www.google.com/maps/search/?api=1&amp;query=%EA%B2%BD%EB%B6%81+%EA%B2%BD%EC%82%B0%EC%8B%9C+%EB%82%A8%EB%A7%A4%EA%B3%B5%EC%9B%90%EB%A1%9C2%EA%B8%B8+10" style="align-self: flex-start; padding: 12px 18px; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #0070C0; border-radius: 4px">지도에서 보기</a>
</div>
</div>

<form id="inquiry" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 8px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-size: 26px; font-weight: 900">문의 양식</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">이름 *<input class="fld" type="text" name="name" required></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">회사·기관명<input class="fld" type="text" name="company"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">연락처 *<input class="fld" type="tel" name="phone" required></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">이메일 *<input class="fld" type="email" name="email" required></label>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">문의 분야
<select class="fld" name="category">
<option>복합소재·플라스틱 제품</option>
<option>금형·사출</option>
<option>해석 (자체 솔버·CAE)</option>
<option>시편·시제품 제작</option>
<option>로봇·자동화</option>
<option>정부과제 협력</option>
</select>
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">문의 내용 *<textarea class="fld" name="message" rows="7" required style="resize: vertical"></textarea></label>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #4A5568">도면(STEP·DXF·PDF)·사진은 이메일로 보내 주세요.</p>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" name="agree" required style="width: 20px; height: 20px">개인정보 수집·이용에 동의합니다. (필수)</label>
<button type="submit" style="align-self: flex-start; min-height: 52px; padding: 14px 32px; font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; color: #FFFFFF; background: #0070C0; border: none; border-radius: 4px; cursor: pointer">문의 보내기</button>
</form>

</section>

<footer style="background: #16263F; color: #C9D3E0">
<div style="max-width: 1200px; margin: 0 auto; padding: 40px 24px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; font-size: 14px; line-height: 1.8">
<div>
<img src="images/logo.svg" alt="STAR Works" style="height: 34px; width: auto; display: block; margin-bottom: 10px">
<p style="margin: 0">스타웍스 · 대표 신동우</p>
<p style="margin: 0">경북 경산시 남매공원로2길 10, 1층</p>
<p style="margin: 0">Tel 010-4401-7115 · shindongwoo@gmail.com</p>
</div>
<p style="margin: 0; align-self: flex-end">© STARWORKS</p>
</div>
</footer>

</div>
<script>
document.getElementById('inquiry').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target;
  var v = function (n) { return (f.elements[n] && f.elements[n].value || '').trim(); };
  var subject = '[홈페이지 문의] ' + v('category') + ' - ' + v('name');
  var lines = [
    '이름: ' + v('name'),
    '회사·기관명: ' + v('company'),
    '연락처: ' + v('phone'),
    '이메일: ' + v('email'),
    '문의 분야: ' + v('category'),
    '',
    v('message')
  ];
  location.href = 'mailto:shindongwoo@gmail.com?subject=' + encodeURIComponent(subject) +
    '&body=' + encodeURIComponent(lines.join('\n'));
});
</script>
</body>
</html>
